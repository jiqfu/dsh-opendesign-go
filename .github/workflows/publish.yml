name: Release

# A push to main only verifies (see verify.yml); a release is cut by tagging.
# This workflow never publishes to npm — the plugin ships as a tarball attached
# to the GitHub Release. npm requires a granular token with 2FA bypass to
# publish, and `npm install -g` cannot install this plugin anyway: the DSH
# loader resolves packages from the profile directory, never from the global
# prefix. A tarball is the supported artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package and attach to (e.g. v0.1.11)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploading the tarball to the Release needs write access to contents.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run check:dist` rebuilds and compares against the committed
          # lib/, so the tag's own tree is what gets verified and shipped.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `lib/` is committed; this fails the run when the committed artifact has
      # drifted from src/, which is a broken release even though it installs.
      - run: npm run check:dist

      - run: npm run typecheck

      - run: npm test

      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
        env:
          # push 事件给 ref_name（v0.1.11）；手动触发时用输入的 tag。
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - run: npm pack --dry-run

      - name: Pack the tarball
        run: |
          set -euo pipefail
          rm -f *.tgz
          npm pack
          ls -l ./*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14

      # Attach to the Release the tag already owns. `--clobber` keeps a re-run
      # on the same tag idempotent instead of failing on the existing asset.
      - name: Attach the tarball to the Release
        run: gh release upload "$RELEASE_TAG" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # push 事件给 ref_name（v0.1.11）；手动触发时用输入的 tag。
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
