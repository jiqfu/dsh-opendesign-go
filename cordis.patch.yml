- insert:
    - id: opendesign-go
      # The loader resolves `name` as a bare module specifier through Node's own
      # rules, so it must be the package's real name — including the scope. A
      # short name only works when the package is published unscoped.
      name: '@jiqfu/dsh-opendesign-go'
      # Declared so the entry carries a config document from the first boot. An
      # entry with no config has no user layer, and the settings service then has
      # nothing to project into an editable form.
      config:
        enabled: true
        apiKeyEnv: OPENDESIGN_API_KEY
        accounts: []
        autoSwitch: false
        sessionRef: ''
        workspaceId: ''
        usageJson: ''
        reportJson: ''
        useVelaCredential: false
        modelParamsJson: ''
        enabledModelsJson: ''
        planOverrides: ''
        alignBaselineJson: ''
        recoveredEnabled: false
        recoveredProviders: ''
        refreshNonce: ""
        baseURL: https://amr-link.open-design.ai/v1
        requestTimeoutMs: 1800000
        streamIdleTimeoutMs: 300000
